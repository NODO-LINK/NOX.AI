# Compila la APK de pasajeros (con el widget) y la deja para descargar en Actions → esta ejecución → Artifacts.
# Para que se instale encima de la actual, se firma con la MISMA llave. Agrégala en:
# GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   WHEREAPP_KEYSTORE_BASE64  (el archivo signing.keystore en base64)
#   WHEREAPP_STORE_PASSWORD   WHEREAPP_KEY_ALIAS   WHEREAPP_KEY_PASSWORD  (están en signing-key-info.txt)
name: Compilar APK de pasajeros

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Número de versión (más alto que el de la APK instalada)"
        required: true
        default: "100"
  push:
    paths:
      - "android/**"
      - ".github/workflows/apk-pasajeros.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Preparar la llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.WHEREAPP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/llave.keystore"
            echo "WHEREAPP_KEYSTORE=$RUNNER_TEMP/llave.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secret WHEREAPP_KEYSTORE_BASE64: la APK sale SIN FIRMA (solo sirve de prueba)."
          fi
      - name: Compilar
        env:
          WHEREAPP_STORE_PASSWORD: ${{ secrets.WHEREAPP_STORE_PASSWORD }}
          WHEREAPP_KEY_ALIAS: ${{ secrets.WHEREAPP_KEY_ALIAS }}
          WHEREAPP_KEY_PASSWORD: ${{ secrets.WHEREAPP_KEY_PASSWORD }}
          WHEREAPP_VERSION_CODE: ${{ github.event.inputs.version_code || '100' }}
        run: gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Whereapp-pasajeros-apk
          path: android/app/build/outputs/apk/release/*.apk
